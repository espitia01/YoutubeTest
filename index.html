<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Watch</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="icon-96.png" sizes="96x96">
</head>
<body>
  <div id="app">

    <section id="browse" class="screen">
      <header class="header">
        <div class="header-brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>Watch</h1>
        </div>
        <span class="header-meta" id="video-count">07 titles</span>
      </header>

      <div class="content" id="video-list" role="list"></div>

      <nav class="nav-bar">
        <button class="nav-item primary focusable symbol" data-action="play-selected" tabindex="0" aria-label="Play">&#9654;</button>
      </nav>
    </section>

    <section id="player-screen" class="screen hidden">
      <header class="header player-chrome">
        <button class="back-btn focusable symbol" data-action="back" tabindex="0" aria-label="Back">&#8592;</button>
        <h1 id="now-playing-title">Now Playing</h1>
      </header>
      <div class="player-wrap">
        <div id="player"></div>
      </div>
      <nav class="nav-bar nav-bar-split player-chrome">
        <button class="nav-item focusable symbol" data-action="toggle-play" tabindex="0" id="play-btn" aria-label="Pause">&#9208;</button>
        <button class="nav-item focusable symbol" data-action="next-video" tabindex="0" id="next-btn" aria-label="Next">&#9197;</button>
        <button class="nav-item focusable symbol" data-action="toggle-fullscreen" tabindex="0" id="fullscreen-btn" aria-label="Fullscreen">&#9974;</button>
      </nav>
      <button class="fullscreen-surface focusable hidden" id="fullscreen-surface" data-action="fullscreen-surface" tabindex="0" aria-label="Show controls"></button>
      <button class="fullscreen-exit focusable symbol hidden" data-action="exit-fullscreen" tabindex="0" aria-label="Exit fullscreen">&#10005;</button>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
