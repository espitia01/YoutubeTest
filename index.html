<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Watch</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-96.png" sizes="96x96">
</head>
<body>
  <div id="app">

    <!-- Browse -->
    <section id="browse" class="screen">
      <header class="header">
        <div class="header-brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>Watch</h1>
        </div>
        <span class="header-meta" id="video-count"></span>
      </header>

      <div class="content" id="video-list" role="list"></div>

      <nav class="nav-bar">
        <button class="nav-item primary focusable" data-action="play-selected" tabindex="0">
          Play
        </button>
      </nav>
    </section>

    <!-- Player -->
    <section id="player-screen" class="screen hidden">
      <header class="header player-chrome">
        <button class="back-btn focusable" data-action="back" tabindex="0" aria-label="Back">←</button>
        <h1 id="now-playing-title">Now Playing</h1>
      </header>

      <div class="player-wrap">
        <div id="player"></div>
      </div>

      <nav class="nav-bar nav-bar-split player-chrome">
        <button class="nav-item focusable" data-action="toggle-play" tabindex="0" id="play-btn">
          Pause
        </button>
        <button class="nav-item focusable" data-action="next-video" tabindex="0" id="next-btn">
          Next
        </button>
        <button class="nav-item focusable" data-action="toggle-fullscreen" tabindex="0" id="fullscreen-btn">
          Full
        </button>
      </nav>

      <button class="fullscreen-exit focusable hidden" data-action="exit-fullscreen" tabindex="0" aria-label="Exit fullscreen">
        Exit
      </button>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
